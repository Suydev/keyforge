name: ci
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are cancelled: CI storage is a shared,
# account-wide quota, and re-running a superseded commit keeps a second copy of
# the same rust-cache entries alive for no benefit. Release builds are exempt
# (see release.yml) -- a half-built release is worse than a duplicate one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The gateway is a headless Linux service; the Android/Termux runtime and the
# zen IP-pool harvester are exercised on-device, not here. This job exists to
# keep main green: it is the compile + unit-test gate for the Rust changes that
# cannot be reproduced in CI (the free-tier proxy behaviour is live-network).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, cached)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Only the registry/index is worth keeping. Caching target/ duplicates the
      # compiled output for every commit, which is the single largest consumer of
      # a 10 GB repo cache, and the build below is fast enough without it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            keyforge -> target
          cache-target: false
          cache-on-failure: false
          shared-key: ci

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

  zen-pool-lint:
    # The Node harvester that feeds the egress pool is plain JS with no deps;
    # lint it here so a typo cannot reach the device and silently stop refills.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check the on-device harvester + gateway
        run: |
          node --check zengate/poolkeeper.mjs
          node --check zengate/gate.mjs
